§[project]
name = "script_bpe"
version = "0.6.0"
description = "BPE with support for SCRIPT encoding"
authors = [
    {name = "Sander Land", email = "sander@writer.com"},
    {name = "Catherine Arnett", email = "catherine@eleuther.ai"},
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.5.0",
    "polars>=1.29.0",
    "numpy>=2.2.4",
    "regex>=2024.11.6",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "scipy>=1.16.1",
    "frozendict>=2.4.6",
    "pydantic>=2.11.7",
    "matplotlib>=3.10.5",
    "python-dotenv>=1.1.1",
    "cyclopts>=3.24.0",
    "seaborn>=0.13.2",
    "plotly>=6.3.1",
    "huggingface-hub<1.0",
    "transformers>=4.57.1",
    "openai>=2.8.0",
]

[project.scripts]
train = "script_bpe.train:main"

[project.optional-dependencies]
fast = [
    "pybind11>=2.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.9",
    "pytest>=8.3.5",
    "pip>=25.1.1",
    "scalene>=1.5.51",
    "jinja2>=3.1.6",
    "mypy>=1.17.1",
    "ipykernel>=6.30.1",
    "matplotlib>=3.10.5",
    "statsmodels>=0.14.5",
    "pybind11>=2.10.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["hatchling", "hatch-cpp", "pybind11"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["script_bpe"]

# C++ extensions using hatch-cpp
[tool.hatch.build.hooks.hatch-cpp]

[[tool.hatch.build.hooks.hatch-cpp.libraries]]
name = "script_bpe/fast/fast_tokenizer_cpp"
sources = ["script_bpe/fast/python_bindings.cpp", "script_bpe/fast/bpe_core.cpp"]
include-dirs = ["script_bpe/fast"]
binding = "pybind11"
std = "c++17"
extra-compile-args = ["-O3", "-DNDEBUG", "-DMERGE_MAP_STD", "-DPQ_STD_HEAP"]

[[tool.hatch.build.hooks.hatch-cpp.libraries]]
name = "script_bpe/fast/fast_unigram_cpp"
sources = ["script_bpe/fast/unigram_bindings.cpp", "script_bpe/fast/unigram_core.cpp"]
include-dirs = ["script_bpe/fast"]
binding = "pybind11"
std = "c++17"
extra-compile-args = ["-O3", "-DNDEBUG"]
